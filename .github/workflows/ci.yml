name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & demo (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Byte-compile (import check)
        run: python -m compileall -q agentflow examples tests

      - name: Run test suite
        run: |
          python - <<'PY'
          import sys, pathlib, importlib
          root = pathlib.Path(".").resolve()
          sys.path.insert(0, str(root))
          passed = failed = 0
          for path in sorted((root / "tests").glob("test_*.py")):
              mod = importlib.import_module(f"tests.{path.stem}")
              for f in sorted(x for x in dir(mod) if x.startswith("test_")):
                  try:
                      getattr(mod, f)()
                      print("PASS", f)
                      passed += 1
                  except Exception as exc:
                      print("FAIL", path.name, f, "->", repr(exc))
                      failed += 1
          print(f"\n{passed} passed, {failed} failed")
          if failed:
              raise SystemExit(1)
          PY

      - name: Run offline demos
        run: |
          python examples/research_report.py "agentic AI governance in 2026"
          python examples/swarm_research.py "agentic AI governance in 2026"
