[project]
name = "agentflow"
version = "0.4.1"
description = "A governed, verifiable, multi-agent pipeline toolkit (Python stdlib only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "travisgadow" }]
keywords = ["agentic-ai", "multi-agent", "orchestration", "governance", "verification", "memory", "parallelism", "web-ui"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies on purpose — stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentflow = "agentflow.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
